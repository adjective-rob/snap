name: Release

# Tag push (v*.*.*): build every platform and attach the files to a GitHub
# release. Manual run: build only, files are kept as workflow artifacts.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Raw binary, not a .deb/AppImage: the frontend is embedded, and a
          # package would install /usr/bin/snap on top of snapd's command.
          # 22.04 keeps the glibc requirement low. install.sh downloads this.
          - name: linux-x86_64
            os: ubuntu-22.04
            target: ''
            args: --no-bundle
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            args: --bundles app --target aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            args: --bundles app --target x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: ''
            args: ''

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Node dependencies
        working-directory: app
        run: npm ci

      - name: Build Tauri app
        working-directory: app
        run: npx tauri build ${{ matrix.args }}

      # Asset names are what install.sh asks for; keep them in sync.
      - name: Collect release files
        shell: bash
        run: |
          mkdir dist
          case "${{ runner.os }}" in
            Linux)
              cp app/src-tauri/target/release/snap "dist/snap-${{ matrix.name }}"
              ;;
            macOS)
              ditto -c -k --keepParent \
                "app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/snap.app" \
                "dist/snap-${{ matrix.name }}.zip"
              ;;
            Windows)
              cp app/src-tauri/target/release/bundle/nsis/*.exe dist/
              ;;
          esac
          ls -l dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
